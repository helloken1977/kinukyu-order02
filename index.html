    d.innerHTML=`<input placeholder="控え選手名" value="${esc(v)}"><button aria-label="削除">×</button>`;
    d.querySelector("input").oninput=e=>{S.bench[i]=e.target.value;save()};
    d.querySelector("button").onclick=()=>{S.bench.splice(i,1);if(!S.bench.length)S.bench=[""];renderBench();save()};
    b.appendChild(d);
  });
}

function setBandTxt(b){b.textContent="";if(S.cur){const sp=document.createElement("span");sp.textContent=S.cur;b.appendChild(sp);placeLogo()}}
function placeLogo(){
  const R=1772/1572,cl=document.getElementById("curlogo"),cu=document.getElementById("cur"),v=document.getElementById("app").dataset.view;
  if(!cl)return;
  cl.src||(cl.src=LOGO);
  const reset=()=>{cl.style.left=cl.style.top=cl.style.right=cl.style.bottom="auto"};
  if(!S.cur&&(v==="all"||v==="field")){
    const h=v==="all"?80:94,w=h/R;reset();
    cl.style.width=w+"px";cl.style.height=h+"px";cl.style.right="10px";
    cl.style.bottom=v==="all"?"calc(var(--b,52px) + 20px)":"calc(var(--b,52px) + 30px)";
    cl.classList.add("on");return;
  }
  if(v==="all"){
    if(!cu.offsetWidth){cl.classList.remove("on");return}
    let h=Math.min(125,Math.max(40,cu.offsetHeight*2.8));
    const room=cu.offsetTop-4;if(h>room)h=room;
    const w=h/R;reset();
    cl.style.width=w+"px";cl.style.height=h+"px";
    cl.style.left=(cu.offsetLeft+(cu.offsetWidth-w)/2)+"px";cl.style.top=(cu.offsetTop-h-4)+"px";
    cl.classList.toggle("on",h>=24);
  }else if(v==="field"){
    const sh=22*String(S.cur).split("\n").length+11;
    const h=Math.min(143,Math.max(77,sh*2.86)),w=h/R;reset();
    cl.style.width=w+"px";cl.style.height=h+"px";
    cl.style.right="10px";cl.style.bottom="calc(var(--b,52px) + 30px)";
    cl.classList.add("on");
  }else cl.classList.remove("on");
}

function showCur(){document.getElementById("cur").textContent=S.cur||"";setBandTxt(document.getElementById("band"));placeLogo()}
const SK="lineup-saves";
const getSaves=()=>{try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return[]}};
const putSaves=a=>{let ok=false;try{const j=JSON.stringify(a);localStorage.setItem(SK,j);idbSet(SK,j);ok=true}catch(e){}
  if(dbRef){try{dbRef.doc(PK()+"saves").set({json:JSON.stringify(a)}).catch(()=>{});ok=true}catch(e){}}return ok};
const pop=document.getElementById("pop"),pbody=document.getElementById("pbody"),pt=document.getElementById("pt");
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function closePop(){pop.classList.remove("on")}
pop.addEventListener("pointerdown",e=>{if(e.target===pop)closePop()});
function row(s,onTap,del){
  const d=document.createElement("div");d.className="sv";
  d.innerHTML=`<b>${esc(s.name)}</b><small>${fmt(s.t)}</small>`;
  d.onclick=onTap;
  if(del){const x=document.createElement("button");x.className="x";x.textContent="削除";
    x.onclick=e=>{e.stopPropagation();if(x.dataset.s){const a=getSaves().filter(v=>v.id!==s.id);putSaves(a);openLoad()}else{x.dataset.s=1;x.textContent="本当に削除"}};d.appendChild(x)}
  return d;
}
function openSave(){
  pt.textContent="保存";pbody.innerHTML=`<textarea id="sname" rows="2" placeholder="名前を入力（2行まで可）" maxlength="40"></textarea><button class="pri" id="sdo">この名前で保存</button>`;
  const saves=getSaves(),inp=document.getElementById("sname");
  if(saves.length){const h=document.createElement("div");h.className="empty";h.textContent="上書きするには、下の保存データをタップ";pbody.appendChild(h);
    saves.forEach(s=>pbody.appendChild(row(s,()=>{inp.value=s.name})))}
  document.getElementById("sdo").onclick=()=>{
    const name=inp.value.trim();if(!name){inp.focus();return}
    const snap={players:JSON.parse(JSON.stringify(S.players)),order:JSON.parse(JSON.stringify(S.order)),geo:geo()};
    const a=getSaves(),i=a.findIndex(v=>v.name===name),item={id:i>=0?a[i].id:Date.now(),name,t:Date.now(),data:snap};
    if(i>=0)a[i]=item;else a.unshift(item);
    S.cur=name;showCur();save();closePop();toast(putSaves(a)?"保存しました":"保存できませんでした");
  };
  pop.classList.add("on");
}
function openLoad(){
  pt.textContent="呼出";pbody.innerHTML="";const saves=getSaves();
  if(!saves.length){pbody.innerHTML='<div class="empty">保存データがありません</div>'}
  saves.forEach(s=>pbody.appendChild(row(s,()=>{
    S.players=JSON.parse(JSON.stringify(s.data.players));S.order=JSON.parse(JSON.stringify(s.data.order));
    while(S.order.length<9)S.order.push({name:"",pos:""});
    S.geo=s.data.geo||null;syncGeo();
    S.cur=s.name;showCur();renderPlayers();renderOrder();save();closePop();toast("「"+s.name+"」を呼び出しました");
  },true)));
  pop.classList.add("on");
}
showCur();document.getElementById("saveBtn").onclick=openSave;
document.getElementById("loadBtn").onclick=openLoad;
function applyView(){
  const m=S.view||"all";document.getElementById("app").dataset.view=m;
  document.getElementById("vb").style.display="flex";
  document.getElementById("vb1").textContent=m==="all"?"守備ポジションのみ表示":"全表示";
  document.getElementById("vb2").textContent=m==="list"?"守備ポジションのみ表示":"打順リストのみ表示";
  document.getElementById("hint").innerHTML=m==="field"?"ドラッグで移動<br>タップで編集":"ドラッグで移動<br>タップで編集<br>打順リストにドラッグ";
}
function setView(m){
  S.view=m;applyView();setListSize();
  if(m==="list"){renderOrder();renderBenchList()}else{syncGeo();centerBench();renderPlayers();renderBenchList()}
  save();
}
function setListSize(){
  const bt=document.getElementById("bottom");
  if((S.view||"all")!=="list"){bt.style.removeProperty("--rh");return}
  const H=document.getElementById("app").offsetHeight,n=Math.max(9,S.order.length)+6;
  bt.style.setProperty("--rh",Math.max(30,Math.min(60,Math.floor((H-175)/n)-4,Math.floor((document.getElementById("app").offsetWidth-126)/6.5)))+"px");
}
function centerBench(){const g=geo(),lim=g.Ht-g.b;S.players.forEach(q=>{if(q.y/100*g.Ht>lim)q.y=(g.Ht-g.b/2)/g.Ht*100})}
function applyBand(){
  const cnt={};S.players.forEach(q=>{const k=COLORS[q.c]?q.c:0;cnt[k]=(cnt[k]||0)+1});
  let best=0,bn=-1;for(const k in cnt)if(cnt[k]>bn){bn=cnt[k];best=+k}
  const bd=document.getElementById("band");bd.style.background=COLORS[best];bd.style.color=DARK_TXT[best];setBandTxt(bd);
}
document.getElementById("stbtn").onclick=()=>{const K=["standard","wb","chalk","classic","retro","game","lineup","laser"];S.style=K[(Math.max(0,K.indexOf(S.style||"lineup"))+1)%K.length];applyStyle();save()};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeSt();placeLogo();syncNmFont()});
try{const ro=new ResizeObserver(()=>placeLogo());ro.observe(document.getElementById("cur"));ro.observe(document.getElementById("band"));
const mo=new MutationObserver(()=>placeLogo());mo.observe(document.getElementById("app"),{attributes:true,attributeFilter:["data-view","style"]});mo.observe(document.getElementById("top"),{attributes:true,attributeFilter:["style","class"]});mo.observe(document.documentElement,{attributes:true,attributeFilter:["style"]})}catch(e){}
window.addEventListener("resize",placeLogo);
try{const ro2=new ResizeObserver(()=>{if((S.view||"all")==="list")return;clearTimeout(window.__ltm);window.__ltm=setTimeout(()=>{syncGeo();renderPlayers()},60)});ro2.observe(document.getElementById("order"))}catch(e){}
document.getElementById("vsw").onclick=()=>{const V=["all","field","list"];setView(V[(V.indexOf(S.view||"all")+1)%3])};
document.getElementById("vb1").onclick=()=>setView((S.view||"all")==="all"?"field":"all");
document.getElementById("vb2").onclick=()=>setView(S.view==="list"?"field":"list");
function benchPlayers(){
  const g=S.geo||{Ht:450,b:52},lim=g.Ht-(g.b||52);
  return S.players.filter(q=>q.y/100*g.Ht>lim).sort((a,b)=>a.x-b.x);
}
function renderBenchList(){
  const box=document.getElementById("benchlist");box.innerHTML="";
  if((S.view||"all")!=="list")return;
  const h=document.createElement("h2");h.textContent="控え";h.style.margin="2px 0 1px";box.appendChild(h);
  const bp=benchPlayers();
  const slots=Math.max(S.benchN||10,bp.length);
  for(let i=0;i<slots;i++){
    let q=bp[i];
    const d=document.createElement("div");d.className="row";
    d.innerHTML='<div class="no" style="background:#6b7a70">'+(i+1)+'</div><input class="nm" placeholder="控え選手名"><div class="bw"><input class="bn" type="text" inputmode="numeric" maxlength="3" placeholder="#"></div>';
    const nm=d.querySelector(".nm"),bn=d.querySelector(".bn"),bw=d.querySelector(".bw"),c=q&&COLORS[q.c]?q.c:0;
    bw.insertAdjacentHTML("afterbegin",shirt(c,""));bn.style.color=DARK_TXT[c];
    if(q){nm.value=q.name||"";bn.value=q.num||""}
    const ensure=()=>{
      if(q)return;
      const g=S.geo||{Ht:450};
      q={id:Date.now()+i,num:"",name:"",c:0,x:Math.min(94,bp.length?bp[bp.length-1].x+10:8),y:100-26/g.Ht*100};
      bp.push(q);S.players.push(q);
    };
    const upd=()=>{S.order.forEach(r=>{if(r.pid===q.id){r.name=q.name;r.num=q.num}})};
    nm.oninput=()=>{ensure();q.name=nm.value;upd();save()};
    bn.oninput=()=>{ensure();q.num=bn.value;upd();save()};
    box.appendChild(d);
  }
  const c=document.createElement("div");c.className="btns";
  c.innerHTML='<button id="addslot">枠を追加</button><button id="delslot">枠を削除</button><button id="saveBtn2" class="sb">保存</button><button id="loadBtn2" class="lb">呼出</button>';
  box.appendChild(c);
  document.getElementById("addslot").onclick=()=>{S.benchN=Math.min(20,Math.max(S.benchN||10,bp.length)+1);renderBenchList();save()};
  document.getElementById("delslot").onclick=()=>{S.benchN=Math.max(bp.length,1,(S.benchN||10)-1);renderBenchList();save()};
  document.getElementById("saveBtn2").onclick=openSave;document.getElementById("loadBtn2").onclick=openLoad;
}
function syncNmFont(){
  const n=document.querySelector("#fprobe .n");if(!n)return;
  const c=getComputedStyle(n),b=document.body.style;
  b.setProperty("--nmf",c.fontFamily);b.setProperty("--nmw",c.fontWeight);
}
function placeSt(){
  const v=document.getElementById("vsw"),b=document.getElementById("stbtn");if(!v||!b)return;
  const c=getComputedStyle(v),r=RU(v);
  ["backgroundColor","backgroundImage","color","border","borderRadius","boxShadow","opacity","clipPath","filter"].forEach(k=>b.style[k]=c[k]);
  b.style.height=r.height+"px";b.style.left=(r.right+6)+"px";
}
function applyStyle(){
  const st=S.style||"lineup";
  const MAP={wb:"wb",ck:"chalk",cl:"classic",rp:"retro",gm:"game",lu:"lineup",lz:"laser"};
  for(const c in MAP){field.classList.toggle(c,st===MAP[c]);document.body.classList.toggle(c,st===MAP[c])}
  placeSt();placeLogo();syncNmFont();setTimeout(()=>{placeSt();placeLogo();syncNmFont()},60);
}
function openSettings(openStyle){
  pt.textContent="環境設定";pbody.innerHTML="";
  const mk=(t,fn)=>{const b=document.createElement("button");b.className="mi";b.textContent=t;b.onclick=fn;pbody.appendChild(b);return b};
  const sty=(b,id)=>{const el=document.getElementById(id);if(!el)return;const c=getComputedStyle(el);["background","color","border","borderRadius","boxShadow","outline","outlineOffset","textShadow","fontFamily","fontWeight","fontStyle","letterSpacing","filter"].forEach(k=>b.style[k]=c[k])};
  sty(mk("保存",openSave),"saveBtn");sty(mk("呼出",openLoad),"loadBtn");mk("全てリセット",openReset);
  const box=document.createElement("div");box.className="sub";box.style.display=openStyle?"block":"none";
  mk("スタイル変更",()=>{box.style.display=box.style.display==="block"?"none":"block"});
  pbody.appendChild(box);
  [["standard","スタンダード"],["wb","ホワイトボード"],["chalk","チョークボード"],["classic","クラシック"],["retro","レトロポップ"],["game","ゲーム"],["lineup","MLBスタイル"],["laser","サイバーパンク"]].forEach(([k,n])=>{
    const on=(S.style||"lineup")===k,o=document.createElement("button");
    o.className="mi op"+(on?" on":"");o.dataset.k=k;o.textContent=n+(on?" ✓":"");
    o.onclick=()=>{S.style=k;applyStyle();save();openSettings(true)};box.appendChild(o);
  });
  const vi=document.createElement("div");vi.style.cssText="text-align:center;font-size:11px;opacity:.6;margin-top:10px";vi.textContent="ver 153 / "+innerWidth+"×"+innerHeight+" / 縮小 "+KK();pbody.appendChild(vi);
  pop.classList.add("on");
}
function openReset(){
  pt.textContent="全てリセット";
  pbody.innerHTML='<div class="rmsg">現在表示されているデータを全てリセットします。\n本当にリセットしますか？\n保存データはリセットされません。</div><div class="ract"><button id="rgo">実行</button><button id="rno">キャンセル</button></div>';
  document.getElementById("rno").onclick=()=>openSettings();
  document.getElementById("rgo").onclick=()=>{
    S.view="all";applyView();S.order=[];while(S.order.length<9)S.order.push({name:"",pos:""});applyLayout();S.players=defaultPlayers();S.geo=geo();S.cur="";
    renderPlayers();renderOrder();showCur();save();closePop();toast("リセットしました");
  };
  pop.classList.add("on");
}
document.getElementById("setbtn").onclick=()=>openSettings();
document.addEventListener("contextmenu",e=>{if(!(e.target.closest&&e.target.closest("input,textarea")))e.preventDefault()});
let rsT=null;
function onResize(){clearTimeout(rsT);rsT=setTimeout(()=>{if(window.__setH&&window.__setH()){setListSize();if((S.view||"all")!=="list"){syncGeo();renderPlayers()}save()}else setListSize()},120)}
window.addEventListener("resize",onResize);window.addEventListener("resize",placeSt);if(window.visualViewport)window.visualViewport.addEventListener("resize",onResize);window.addEventListener("orientationchange",onResize);
applyView();setListSize();syncGeo();renderPlayers();renderOrder();renderBenchList();applyStyle();save();
(async()=>{
  try{
    if(WAS_FRESH){
      const j=await idbGet(KEY);
      if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.players)&&o.players.length){S=o;if(!Array.isArray(S.order))S.order=[];while(S.order.length<9)S.order.push({name:"",pos:""});try{localStorage.setItem(KEY,j)}catch(e){}applyView();setListSize();syncGeo();renderPlayers();renderOrder();renderBenchList();showCur();applyStyle()}}
    }
    if(!localStorage.getItem(SK)){const j=await idbGet(SK);if(j)try{localStorage.setItem(SK,j)}catch(e){}}
  }catch(e){}
  mirrorOn=true;try{idbSet(KEY,JSON.stringify(S));idbSet(SK,localStorage.getItem(SK)||"[]")}catch(e){}
})();
(async()=>{try{
  if(typeof claude==="undefined")return;
  const db=await claude.use("db"),user=await claude.use("user");
  if(!db||!user)return;
  uid=await user.id();if(!uid)return;dbRef=db;
  const st=await db.doc(PK()+"state").get();
  if(st.exists){const j=st.data().json;S=JSON.parse(j);if(S.v!==2){S.players=defaultPlayers();S.v=2;S._init=1}if(!Array.isArray(S.players))S.players=[];if(!Array.isArray(S.order))S.order=[];while(S.order.length<9)S.order.push({name:"",pos:""});
    try{localStorage.setItem(KEY,j)}catch(e){}applyView();setListSize();syncGeo();renderPlayers();renderOrder();renderBenchList();showCur();applyStyle()}else pushState();
  const sv=await db.doc(PK()+"saves").get();
  if(sv.exists){try{localStorage.setItem(SK,sv.data().json)}catch(e){}}else{const l=getSaves();if(l.length)putSaves(l)}
}catch(e){}})();

const flush=()=>{clearTimeout(tmS);try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);idbSet(KEY,j)}catch(e){}try{pushState()}catch(e){}};
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
window.addEventListener("pagehide",flush);
</script>
</body>
